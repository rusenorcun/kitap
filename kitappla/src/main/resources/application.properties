spring.application.name=kitapla

# --- Veritabanı (dev: H2 dosya) ---
spring.datasource.url=jdbc:h2:file:./data/kitapla;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=${KITAPLA_FLYWAY_ENABLED:false}
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- Thymeleaf ---
spring.thymeleaf.cache=false
# Sablon islenirken cikti parca parca yazilirsa, render sirasinda olusan bir hata
# yaniti "kismen yazilmis" birakir: Spring hata sayfasina gecemez ve kullanici
# Whitelabel sayfasini gorur. Tamponlayarak hata sayfasinin calismasini garantiliyoruz.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# --- Dosya yükleme (öğrenci belgesi, kapak) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
kitapla.upload-dir=./uploads

# --- Marka (tek yapılandırma: ad, alan adı, adresler) ---
# Boş bırakılanlar kendiliğinden türetilir: site adresi https://<alan adi>,
# gönderici info@<alan adi>, iletişim adresi gönderenle aynı olur.
# Dosya ISO-8859-1 okunur: değerlerde Türkçe harf yerine \u kaçışı kullanılır (ör. İ = \u0130).
kitapla.name=${KITAPLA_NAME:KitAppLa}
kitapla.domain=${KITAPLA_DOMAIN:kitappla.com}
# Yönetim ayrı alan adında yayınlanır (ör. https://admin.kitappla.com); boşsa /admin sitenin içindedir.
kitapla.admin-url=${KITAPLA_ADMIN_URL:}

# --- İlk admin (açılışta oluşturulur) ---
# Ortam değişkeniyle ezilebilir: KITAPLA_ADMIN_EMAIL / KITAPLA_ADMIN_PASSWORD
kitapla.admin.email=${KITAPLA_ADMIN_EMAIL:admin@kitapla.app}
kitapla.admin.password=${KITAPLA_ADMIN_PASSWORD:admin123}
kitapla.admin.name=${KITAPLA_ADMIN_NAME:Y\u00F6netici}

# --- İletişim sayfasında gösterilen adres (boşsa gönderici adresi kullanılır) ---
kitapla.contact.email=${KITAPLA_CONTACT_EMAIL:}

# --- Giriş deneme sınırı (kaba kuvvete karşı) ---
kitapla.login.max-attempts=8
kitapla.login.window-minutes=15

server.port=8080

# --- Oturum ve Çerez Güvenliği ---
server.servlet.session.cookie.name=KITAPLA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d
kitapla.security.remember-me.key=${KITAPLA_REMEMBER_ME_KEY:kitappla-super-secret-remember-me-key-change-in-prod}
kitapla.security.remember-me.validity-days=30
kitapla.security.remember-me.secure=false

# --- E-posta ---
# Sağlayıcıdan bağımsız: standart spring.mail.* ayarları kullanılır.
# Yerelde kapalıdır; gönderilecek iletiler yalnızca loglanır.
# Gönderen adres/adı boşsa marka yapılandırmasından türetilir.
kitapla.mail.enabled=${KITAPLA_MAIL_ENABLED:false}
kitapla.mail.from=${KITAPLA_MAIL_FROM:}
kitapla.mail.from-name=${KITAPLA_MAIL_FROM_NAME:}
kitapla.base-url=${KITAPLA_BASE_URL:}

spring.mail.host=${KITAPLA_SMTP_HOST:localhost}
spring.mail.port=${KITAPLA_SMTP_PORT:587}
spring.mail.username=${KITAPLA_SMTP_USER:}
spring.mail.password=${KITAPLA_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KITAPLA_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KITAPLA_SMTP_STARTTLS:true}
# 465 portu (doğrudan SSL) için true, STARTTLS false yapılır. Ör. Natro kurumsal e-posta: mail.kurumsaleposta.com:465
spring.mail.properties.mail.smtp.ssl.enable=${KITAPLA_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Bağlantı jetonları
kitapla.token.reset-minutes=60
kitapla.token.verify-hours=48
kitapla.token.max-per-hour=5

# --- Özellik bayrakları ---
# Kampüs içi yüz yüze teslime geçildi. Kargo ve satın alma akışları silinmedi,
# yalnızca kapatıldı; true yapılarak yeniden açılabilir.
kitapla.features.handover=${KITAPLA_HANDOVER:true}
kitapla.features.shipping=${KITAPLA_SHIPPING:false}
kitapla.features.purchase=${KITAPLA_PURCHASE:false}
kitapla.features.address=${KITAPLA_ADDRESS:false}
kitapla.features.document=${KITAPLA_DOCUMENT:false}

# --- Buluşma hatırlatması ---
kitapla.reminder.hours-before=3
kitapla.reminder.interval-ms=600000

# --- Zamanlanmış işler ---
# İki SSE ping'i ve buluşma hatırlatması aynı anda çalışabilsin: yavaş bir istemciye
# yazım ya da uzun bir hatırlatma turu diğer işleri bekletmesin (varsayılan tek iş parçacığı).
spring.task.scheduling.pool.size=3

# --- Örnek veri ---
# false: yalnızca yönetici hesabı oluşturulur (örnek üyeler/kitaplar/noktalar yok).
# Herkese açık kurulumda örnek hesapların şifresi bilinen bir değer olduğu için
# kapatmak isteyebilirsin.
kitapla.seed.demo=${KITAPLA_SEED_DEMO:true}
