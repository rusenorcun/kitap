spring.application.name=kitappla

# --- Veritabanı (dev: H2 dosya) ---
spring.datasource.url=jdbc:h2:file:./data/kitappla;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=${KITAPPLA_FLYWAY_ENABLED:false}
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- Thymeleaf ---
spring.thymeleaf.cache=false
# Sablon islenirken cikti parca parca yazilirsa, render sirasinda olusan bir hata
# yaniti "kismen yazilmis" birakir: Spring hata sayfasina gecemez ve kullanici
# Whitelabel sayfasini gorur. Tamponlayarak hata sayfasinin calismasini garantiliyoruz.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# --- Dosya yükleme (öğrenci belgesi, kapak) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-part-count=50
kitappla.upload-dir=./uploads

# --- Marka (tek yapılandırma: ad, alan adı, adresler) ---
# Boş bırakılanlar kendiliğinden türetilir: site adresi https://<alan adi>,
# gönderici info@<alan adi>, iletişim adresi gönderenle aynı olur.
# Dosya ISO-8859-1 okunur: değerlerde Türkçe harf yerine \u kaçışı kullanılır (ör. İ = \u0130).
kitappla.name=${KITAPPLA_NAME:KitAppLa}
kitappla.domain=${KITAPPLA_DOMAIN:kitappla.com}
# Yönetim ayrı alan adında yayınlanır (ör. https://admin.kitappla.com); boşsa /admin sitenin içindedir.
kitappla.admin-url=${KITAPPLA_ADMIN_URL:}

# --- İlk admin (açılışta oluşturulur) ---
# Ortam değişkeniyle ezilebilir: KITAPPLA_ADMIN_EMAIL / KITAPPLA_ADMIN_PASSWORD
kitappla.admin.email=${KITAPPLA_ADMIN_EMAIL:admin@kitappla.app}
kitappla.admin.password=${KITAPPLA_ADMIN_PASSWORD:admin123}
kitappla.admin.name=${KITAPPLA_ADMIN_NAME:Y\u00F6netici}

# --- İletişim sayfasında gösterilen adres (boşsa gönderici adresi kullanılır) ---
kitappla.contact.email=${KITAPPLA_CONTACT_EMAIL:}

# --- Giriş deneme sınırı (kaba kuvvete karşı) ---
kitappla.login.max-attempts=8
kitappla.login.window-minutes=15

server.port=8080

# --- Oturum ve Çerez Güvenliği ---
server.servlet.session.cookie.name=KITAPPLA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d
kitappla.security.remember-me.key=${KITAPPLA_REMEMBER_ME_KEY:kitappla-super-secret-remember-me-key-change-in-prod}
kitappla.security.remember-me.validity-days=30
kitappla.security.remember-me.secure=false

# --- Android uygulaması (App Links: /.well-known/assetlinks.json) ---
# applicationId ve imza sertifikalarının SHA-256 parmak izleri (virgülle). Varsayılan: release anahtarı.
# Uygulama Google Play'e "Play App Signing" ile çıkarsa Play Console > Uygulama bütünlüğü'ndeki imzalama
# anahtarının parmak izi de eklenmeli (KITAPPLA_ANDROID_SHA256).
kitappla.android.package=${KITAPPLA_ANDROID_PACKAGE:com.kitappla.app}
kitappla.android.sha256-sertifikalar=${KITAPPLA_ANDROID_SHA256:46:89:02:F9:02:24:90:66:AD:FB:73:02:BC:4D:A0:6F:CA:7D:6A:9B:B9:E0:7F:EB:7B:6B:06:D1:97:11:74:AF}

# --- E-posta ---
# Sağlayıcıdan bağımsız: standart spring.mail.* ayarları kullanılır.
# Yerelde kapalıdır; gönderilecek iletiler yalnızca loglanır.
# Gönderen adres/adı boşsa marka yapılandırmasından türetilir.
kitappla.mail.enabled=${KITAPPLA_MAIL_ENABLED:false}
kitappla.mail.from=${KITAPPLA_MAIL_FROM:}
kitappla.mail.from-name=${KITAPPLA_MAIL_FROM_NAME:}
kitappla.base-url=${KITAPPLA_BASE_URL:}

spring.mail.host=${KITAPPLA_SMTP_HOST:localhost}
spring.mail.port=${KITAPPLA_SMTP_PORT:587}
spring.mail.username=${KITAPPLA_SMTP_USER:}
spring.mail.password=${KITAPPLA_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KITAPPLA_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KITAPPLA_SMTP_STARTTLS:true}
# 465 portu (doğrudan SSL) için true, STARTTLS false yapılır. Ör. Natro kurumsal e-posta: mail.kurumsaleposta.com:465
spring.mail.properties.mail.smtp.ssl.enable=${KITAPPLA_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Bağlantı jetonları
kitappla.token.reset-minutes=60
kitappla.token.verify-hours=48
kitappla.token.max-per-hour=5

# --- Özellik bayrakları ---
# Kampüs içi yüz yüze teslime geçildi. Kargo ve satın alma akışları silinmedi,
# yalnızca kapatıldı; true yapılarak yeniden açılabilir.
kitappla.features.handover=${KITAPPLA_HANDOVER:true}
kitappla.features.shipping=${KITAPPLA_SHIPPING:false}
kitappla.features.purchase=${KITAPPLA_PURCHASE:false}
kitappla.features.address=${KITAPPLA_ADDRESS:false}
kitappla.features.document=${KITAPPLA_DOCUMENT:true}

# --- Buluşma hatırlatması ---
kitappla.reminder.hours-before=3
kitappla.reminder.interval-ms=600000

# --- Zamanlanmış işler ---
# İki SSE ping'i ve buluşma hatırlatması aynı anda çalışabilsin: yavaş bir istemciye
# yazım ya da uzun bir hatırlatma turu diğer işleri bekletmesin (varsayılan tek iş parçacığı).
spring.task.scheduling.pool.size=3

# --- Örnek veri ---
# false: yalnızca yönetici hesabı oluşturulur (örnek üyeler/kitaplar/noktalar yok).
# Herkese açık kurulumda örnek hesapların şifresi bilinen bir değer olduğu için
# kapatmak isteyebilirsin.
kitappla.seed.demo=${KITAPPLA_SEED_DEMO:true}
