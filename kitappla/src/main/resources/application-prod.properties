# Üretim profili: ters vekil (Caddy) arkasında çalışmak üzere.
# Çalıştırma:  java -jar kitapla.jar --spring.profiles.active=prod

# --- Ters vekil arkasında ---
# Caddy'nin ilettiği X-Forwarded-* başlıkları dikkate alınsın; yoksa giriş
# sonrası yönlendirmeler http:// olarak üretilir ve tarayıcı HTTPS'ten düşer.
server.forward-headers-strategy=framework

# Uygulama varsayılan olarak yalnızca yerel arayüzü dinler; dışarıya sadece
# Caddy açıktır. Docker'da bu 0.0.0.0 olmalıdır (yalıtımı Docker ağı sağlar,
# uygulamanın portu ana makineye hiç yayınlanmaz) — compose bunu ayarlar.
server.address=${KITAPLA_BIND:127.0.0.1}
server.port=${SERVER_PORT:8080}

# Sunucu imzasını ve hata ayrıntılarını dışarı verme
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Oturum ve Çerez Güvenliği (Üretim / HTTPS) ---
server.servlet.session.cookie.name=KITAPLA_SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d
kitapla.security.remember-me.secure=true
kitapla.security.remember-me.key=${KITAPLA_REMEMBER_ME_KEY:kitappla-prod-secret-remember-me-key}

# --- Şablon önbelleği açık (dev'de kapalıydı) ---
spring.thymeleaf.cache=true

# --- H2 konsolu kapalı ---
# application.properties'te geliştirme için açık; burada ezilmezse prod'da da /h2 yolu
# herkese açık kayıtlı kalıyordu (erişimi yalnızca H2'nin uzak bağlantı ayarı engelliyordu).
spring.h2.console.enabled=false

# --- Veritabanı: PostgreSQL + Flyway ---
spring.datasource.url=jdbc:postgresql://${KITAPLA_DB_HOST:postgres}:${KITAPLA_DB_PORT:5432}/${KITAPLA_DB_NAME:kitapla}
spring.datasource.username=${KITAPLA_DB_USER:kitapla}
spring.datasource.password=${KITAPLA_DB_PASSWORD:kitapla}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Bağlantı havuzu (HikariCP) ---
# Varsayılan 10 bağlantı yük testinde 200 eşzamanlı oturumda doydu. Sorgular kısa olduğu
# için 20 yeterli; boş bağlantı beklemesi 30 sn yerine 5 sn: kuyrukta bekleyen istek yerine
# hızlı ve görünür hata.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# --- Tomcat ---
# İş parçacıkları doluyken bekleyebilecek bağlantı sayısı ve boştaki bağlantının ömrü.
# Canlı akış (SSE) bağlantıları iş parçacığı tutmaz; max-connections varsayılanı (8192) yeterli.
server.tomcat.accept-count=200
server.tomcat.keep-alive-timeout=20s

# --- Yüklenen dosyalar ---
kitapla.upload-dir=${KITAPLA_UPLOAD_DIR:./uploads}

# --- Loglama ---
logging.level.root=INFO
logging.level.app.kitapla=INFO

# --- Örnek veri (üretimde varsayılan kapalı; .env içinden açılabilir) ---
kitapla.seed.demo=${KITAPLA_SEED_DEMO:false}


