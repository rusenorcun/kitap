<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{mail/duzen :: govde('Şifreni sıfırla', ~{::icerik})}">
<div th:fragment="icerik" th:remove="tag">
  <p style="margin:0 0 14px;">Merhaba <span th:text="${ad}">Ayşe</span>,</p>
  <p style="margin:0 0 20px;">
    Hesabının şifresini sıfırlamak için bir istek aldık. Aşağıdaki düğmeye tıklayarak
    yeni şifreni belirleyebilirsin.
  </p>
  <p style="margin:0 0 22px;">
    <a th:href="${link}"
       style="display:inline-block;background:#C65D47;color:#ffffff;text-decoration:none;
              font:800 15px/1 'Segoe UI',Arial,sans-serif;padding:14px 26px;border-radius:12px;">
      Yeni şifre belirle</a>
  </p>
  <p style="margin:0 0 14px;color:#8C7B6B;font-size:13px;">
    Bu bağlantı <strong>1 saat</strong> geçerlidir ve yalnızca bir kez kullanılabilir.
  </p>
  <p style="margin:0;color:#8C7B6B;font-size:13px;">
    Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin; şifren değişmez.
  </p>
</div>
</body>
</html>
