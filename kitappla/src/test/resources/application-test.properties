# Testler: bellek içi H2, her çalıştırmada temiz şema
spring.datasource.url=jdbc:h2:mem:kitappla-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false

kitappla.upload-dir=./target/test-uploads
kitappla.admin.email=admin@test.local
kitappla.admin.password=admin123
kitappla.admin.name=Test Y\u00F6netici
kitappla.contact.email=${kitappla.admin.email}

# Testlerde posta gönderilmez; MailService.outbox() üzerinden doğrulanır
kitappla.mail.enabled=false
# Testlerde SMTP teslimi aynı iş parçacığında yapılır; sonuçlar zamanlamaya bağlı olmaz
kitappla.mail.async=false
kitappla.base-url=http://localhost:8080

# Testlerde zamanlanmış hatırlatma kendiliğinden çalışmasın (elle tetiklenir)
kitappla.reminder.interval-ms=86400000
kitappla.reminder.initial-delay-ms=86400000

kitappla.features.document=false
