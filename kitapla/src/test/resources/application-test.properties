# Testler: bellek içi H2, her çalıştırmada temiz şema
spring.datasource.url=jdbc:h2:mem:kitapla-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false

kitapla.upload-dir=./target/test-uploads
kitapla.admin.email=admin@test.local
kitapla.admin.password=admin123
kitapla.admin.name=Test Y\u00F6netici
kitapla.contact.email=${kitapla.admin.email}

# Testlerde posta gönderilmez; MailService.outbox() üzerinden doğrulanır
kitapla.mail.enabled=false
kitapla.base-url=http://localhost:8080
