spring.application.name=kitapla

# --- Veritabanı (dev: H2 dosya) ---
spring.datasource.url=jdbc:h2:file:./data/kitapla;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Dosya yükleme (öğrenci belgesi, kapak) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
kitapla.upload-dir=./uploads

# --- İlk admin (açılışta oluşturulur) ---
kitapla.admin.email=admin@kitapla.app
kitapla.admin.password=admin123
kitapla.admin.name=Yönetici

server.port=8080
