spring.application.name=kitapla

# --- Veritabanı (dev: H2 dosya) ---
spring.datasource.url=jdbc:h2:file:./data/kitapla;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Dosya yükleme (öğrenci belgesi, kapak) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
kitapla.upload-dir=./uploads

# --- İlk admin (açılışta oluşturulur) ---
# Ortam değişkeniyle ezilebilir: KITAPLA_ADMIN_EMAIL / KITAPLA_ADMIN_PASSWORD
kitapla.admin.email=${KITAPLA_ADMIN_EMAIL:admin@kitapla.app}
kitapla.admin.password=${KITAPLA_ADMIN_PASSWORD:admin123}
kitapla.admin.name=${KITAPLA_ADMIN_NAME:Y\u00F6netici}

# --- İletişim sayfasında gösterilen adres (varsayılan: yönetici e-postası) ---
kitapla.contact.email=${KITAPLA_CONTACT_EMAIL:${kitapla.admin.email}}

# --- Giriş deneme sınırı (kaba kuvvete karşı) ---
kitapla.login.max-attempts=8
kitapla.login.window-minutes=15

server.port=8080
