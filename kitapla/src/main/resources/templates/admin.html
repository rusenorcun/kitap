<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('KİTAPLA — Yönetim')}"></head>
<body>
<div th:replace="~{fragments :: appnav('admin')}"></div>

<div class="container" style="padding-top:28px; padding-bottom:56px; max-width:1040px">
  <div class="row" style="justify-content:space-between; margin-bottom:6px">
    <h1 style="font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0">Yönetim panosu</h1>
    <span class="badge badge-sage">Yönetici</span>
  </div>
  <p class="muted" style="font-weight:500;margin:0 0 22px">Platformun genel durumu ve bekleyen işler.</p>

  <div th:replace="~{fragments :: adminnav('pano')}"></div>

  <div th:if="${basari}" class="alert alert-ok" th:text="${basari}">Tamam</div>
  <div th:if="${hata}" class="alert alert-error" th:text="${hata}">Hata</div>

  <!-- Bekleyen iş varsa en üstte -->
  <div th:if="${stats.pendingDocuments() > 0}" class="card card-pad row gap-14"
       style="border-color:var(--accent);margin-bottom:22px">
    <div class="badge badge-accent" style="width:40px;height:40px;border-radius:12px;justify-content:center;padding:0;flex-shrink:0">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    </div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:800" th:text="${stats.pendingDocuments()} + ' öğrenci belgesi incelemeni bekliyor'">2 belge</div>
      <div class="muted" style="font-size:13px;font-weight:500;margin-top:2px">Onaylanan üyeler bağışlarda 48 saat öncelik kazanır.</div>
    </div>
    <a class="btn btn-primary btn-sm" th:href="@{/admin/belgeler}">İncele</a>
  </div>

  <!-- Sayaçlar -->
  <div class="grid gap-12" style="grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:14px">
    <div class="card card-pad" th:each="s : ${ {
            {'Üye', stats.users()},
            {'Onaylı öğrenci', stats.students()}, 
            {'Bekleyen belge', stats.pendingDocuments()},
            {'Askıdaki üye', stats.blocked()},
            {'Yönetici', stats.admins()},
            {'Kitap', stats.books()} } }">
      <div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase"
           th:text="${s[0]}">Üye</div>
      <div style="font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:4px" th:text="${s[1]}">0</div>
    </div>
  </div>

  <h2 style="font-size:16px;font-weight:800;margin:26px 0 12px">Hareketler</h2>
  <div class="grid gap-12" style="grid-template-columns:repeat(auto-fit,minmax(168px,1fr))">
    <div class="card card-pad" th:each="s : ${ {
            {'Açık bağış', stats.openDonations()},
            {'Kapanan bağış', stats.closedDonations()},
            {'Eşleşen talep', stats.matchedClaims()},
            {'Kargodaki talep', stats.shippedClaims()},
            {'Teslim edilen', stats.deliveredClaims()},
            {'Açık istek', stats.openRequests()},
            {'Karşılanan istek', stats.fulfilledRequests()},
            {'Takasta kitap', stats.openSwapBooks()},
            {'Bekleyen teklif', stats.pendingOffers()},
            {'Tamamlanan takas', stats.completedOffers()} } }">
      <div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase"
           th:text="${s[0]}">Bağış</div>
      <div style="font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:4px" th:text="${s[1]}">0</div>
    </div>
  </div>

  <div class="row gap-8" style="margin-top:26px;flex-wrap:wrap">
    <a class="btn btn-soft btn-sm" th:href="@{/admin/uyeler}">Üyeleri yönet</a>
    <a class="btn btn-soft btn-sm" th:href="@{/admin/icerik}">İçerik moderasyonu</a>
    <a class="btn btn-soft btn-sm" th:href="@{/kesfet}">Siteyi üye gözüyle gör</a>
  </div>
</div>
</body>
</html>
