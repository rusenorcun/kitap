<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${title}">KİTAPLA</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v=1)}"/>
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
  <link rel="stylesheet" th:href="@{/css/kitapla.css}"/>
  <script defer th:src="@{/webjars/htmx.org/1.9.12/dist/htmx.min.js}"></script>
  <script th:inline="javascript">
    document.addEventListener('htmx:configRequest', function (e) {
      var t = document.querySelector('meta[name="_csrf"]');
      var h = document.querySelector('meta[name="_csrf_header"]');
      if (t && h && h.content) e.detail.headers[h.content] = t.content;
    });
  </script>
</head>
<body>

<!-- Marka logosu (üç kitap sırtı) -->
<svg th:fragment="logo(size)" th:width="${size}" th:height="${size}" viewBox="0 0 120 120" aria-hidden="true">
  <g transform="rotate(-9 45 62)"><rect x="34" y="34" width="20" height="58" rx="5" fill="#8FA89B"/></g>
  <rect x="52" y="24" width="21" height="70" rx="5" fill="#C65D47"/>
  <g transform="rotate(9 78 60)"><rect x="72" y="30" width="20" height="62" rx="5" fill="#7A2E2A"/></g>
</svg>

<!-- Genel (public) nav -->
<div th:fragment="publicnav" class="nav">
  <a class="brand" th:href="@{/}"><svg th:replace="~{fragments :: logo(30)}"></svg><span>KİTAPLA</span></a>
  <div class="nav-links">
    <a th:href="@{/kesfet}">Keşfet</a>
    <a th:href="@{/#nasil}">Nasıl çalışır</a>
    <a th:href="@{/sss}">SSS</a>
  </div>
  <div class="nav-spacer"></div>
  <div class="row gap-16">
    <a sec:authorize="!isAuthenticated()" class="btn-soft btn btn-sm" th:href="@{/login}">Giriş</a>
    <a sec:authorize="!isAuthenticated()" class="btn btn-primary btn-sm" th:href="@{/register}">Üye ol</a>
    <a sec:authorize="isAuthenticated()" class="btn btn-primary btn-sm" th:href="@{/panom}">Panom</a>
  </div>
</div>

<!-- Uygulama (app) nav -->
<div th:fragment="appnav(active)" class="nav">
  <a class="brand" th:href="@{/panom}"><svg th:replace="~{fragments :: logo(26)}"></svg><span>KİTAPLA</span></a>
  <div class="nav-links">
    <a th:href="@{/kesfet}" th:classappend="${active=='kesfet'}?'active'">Keşfet</a>
    <a th:href="@{/istekler}" th:classappend="${active=='istekler'}?'active'">İstekler</a>
    <a th:href="@{/bagislarim}" th:classappend="${active=='bagislarim'}?'active'">Bağışlarım</a>
    <a th:href="@{/aldiklarim}" th:classappend="${active=='aldiklarim'}?'active'">Aldıklarım</a>
    <a th:href="@{/takas}" th:classappend="${active=='takas'}?'active'">Takas</a>
    <a th:href="@{/mesajlar}" th:classappend="${active=='mesajlar'}?'active'">
      Mesajlar
      <span th:if="${unreadMessages > 0}" th:text="${unreadMessages}"
            style="margin-left:5px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);
                   color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;
                   justify-content:center;padding:0 4px">1</span>
    </a>
    <a th:href="@{/panom}" th:classappend="${active=='panom'}?'active'">Panom</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
       th:classappend="${active=='admin'}?'active'">Yönetim</a>
  </div>
  <div class="nav-spacer"></div>
  <div class="row gap-16">
    <a class="btn btn-primary btn-sm" th:href="@{/bagis/yeni}">Bağış yap</a>
    <a id="nav-bildirim-link" th:href="@{/bildirimler}" title="Bildirimler"
       th:aria-label="${unreadCount > 0} ? 'Bildirimler, ' + ${unreadCount} + ' okunmamış' : 'Bildirimler'"
       style="position:relative;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink)">
      <svg id="nav-bildirim-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.35s ease"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span id="nav-bildirim-sayac" th:text="${unreadCount}" aria-hidden="true"
            th:style="${unreadCount > 0} ? 'position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;transition:all 0.3s ease' : 'position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;transition:all 0.3s ease'">3</span>
    </a>
    <form th:action="@{/logout}" method="post" style="margin:0"><button class="btn btn-soft btn-sm" type="submit">Çıkış</button></form>
    <a class="avatar" th:href="@{/profil}" th:text="${currentUser?.initials}"
       th:title="${currentUser?.name}" aria-label="Profilim">EY</a>
  </div>
  <script th:inline="javascript">
  /*<![CDATA[*/
  (function () {
    if (window.__kitapla_notif_stream_active) return;
    window.__kitapla_notif_stream_active = true;
    if (!window.EventSource) return;

    var akis = new EventSource('/bildirimler/akis');
    akis.addEventListener('bildirim', function (e) {
      try {
        var veri = JSON.parse(e.data);
        var sayi = typeof veri.unread === 'number' ? veri.unread : parseInt(veri.unread, 10);
        var sayac = document.getElementById('nav-bildirim-sayac');
        var icon = document.getElementById('nav-bildirim-icon');
        var link = document.getElementById('nav-bildirim-link');
        if (sayac) {
          var eskiSayi = parseInt(sayac.textContent, 10) || 0;
          sayac.textContent = sayi;
          if (sayi > 0) {
            sayac.style.display = 'flex';
            if (sayi > eskiSayi && icon) {
              icon.style.transform = 'rotate(18deg) scale(1.2)';
              setTimeout(function () { icon.style.transform = 'rotate(-18deg) scale(1.2)'; }, 140);
              setTimeout(function () { icon.style.transform = 'rotate(10deg) scale(1.1)'; }, 280);
              setTimeout(function () { icon.style.transform = 'rotate(0deg) scale(1)'; }, 420);
            }
          } else {
            sayac.style.display = 'none';
          }
          if (link) {
            link.setAttribute('aria-label', sayi > 0 ? 'Bildirimler, ' + sayi + ' okunmamış' : 'Bildirimler');
          }
        }
      } catch (err) {}
    });
    window.addEventListener('beforeunload', function () { akis.close(); });
  })();
  /*]]>*/
  </script>
</div>

<!-- Yönetim alt navigasyonu -->
<div th:fragment="adminnav(active)" class="row gap-8" style="flex-wrap:wrap;margin-bottom:22px">
  <a th:href="@{/admin}" class="btn btn-sm"
     th:classappend="${active=='pano'} ? 'btn-primary' : 'btn-soft'">Pano</a>
  <a th:href="@{/admin/belgeler}" class="btn btn-sm"
     th:classappend="${active=='belgeler'} ? 'btn-primary' : 'btn-soft'">
    Öğrenci belgeleri
    <span th:if="${bekleyenSayisi > 0}" th:text="${bekleyenSayisi}"
          style="margin-left:6px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px">2</span>
  </a>
  <a th:href="@{/admin/uyeler}" class="btn btn-sm"
     th:classappend="${active=='uyeler'} ? 'btn-primary' : 'btn-soft'">Üyeler</a>
  <a th:href="@{/admin/icerik}" class="btn btn-sm"
     th:classappend="${active=='icerik'} ? 'btn-primary' : 'btn-soft'">İçerik</a>
  <a th:href="@{/admin/noktalar}" class="btn btn-sm"
     th:classappend="${active=='noktalar'} ? 'btn-primary' : 'btn-soft'">Teslim noktaları</a>
  <a th:href="@{/admin/sikayetler}" class="btn btn-sm"
     th:classappend="${active=='sikayetler'} ? 'btn-primary' : 'btn-soft'">
    Şikâyetler
    <span th:if="${sikayetSayisi > 0}" th:text="${sikayetSayisi}"
          style="margin-left:6px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px">1</span>
  </a>
</div>

<!-- Footer -->
<div th:fragment="footer" class="footer">
  <a class="brand" style="font-size:15px" th:href="@{/}"><svg th:replace="~{fragments :: logo(24)}"></svg><span>KİTAPLA</span></a>
  <div class="links">
    <a th:href="@{/sss}">SSS</a>
    <a th:href="@{/kurallar}">Kurallar</a>
    <a th:href="@{/gizlilik}">Gizlilik</a>
    <a th:href="@{/iletisim}">İletişim</a>
  </div>
  <span class="muted" style="font-size:13px">© 2026 KİTAPLA</span>
</div>

</body>
</html>
