<!doctype html>
<!--/* E-posta iskeleti. Posta istemcileri harici CSS ve modern seçicileri
        desteklemediği için stiller satır içi ve düzen tablo tabanlıdır. */-->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/></head>
<body th:fragment="govde(baslik, icerik)" style="margin:0;padding:0;background:#F3EAD3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3EAD3;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="max-width:520px;background:#FCF8EE;border:1px solid #E6D8BC;border-radius:18px;overflow:hidden;">
      <tr><td style="padding:26px 30px 0 30px;">
        <div style="font:800 20px/1 'Segoe UI',Arial,sans-serif;color:#3E2723;letter-spacing:.4px;">
          <span style="color:#8FA89B;">▌</span><span style="color:#C65D47;">▌</span><span style="color:#7A2E2A;">▌</span>
          &nbsp;KİTAPLA
        </div>
      </td></tr>
      <tr><td style="padding:20px 30px 30px 30px;font:400 15px/1.65 'Segoe UI',Arial,sans-serif;color:#3E2723;">
        <h1 style="font:800 22px/1.3 'Segoe UI',Arial,sans-serif;color:#3E2723;margin:0 0 14px;"
            th:text="${baslik}">Başlık</h1>
        <div th:replace="${icerik}">İçerik</div>
      </td></tr>
      <tr><td style="padding:18px 30px 26px 30px;border-top:1px solid #E6D8BC;
                     font:400 12px/1.6 'Segoe UI',Arial,sans-serif;color:#8C7B6B;">
        Bu e-postayı KİTAPLA hesabın olduğu için aldın.
        <a th:href="${baseUrl}" th:text="${baseUrl}" style="color:#C65D47;">kitapla</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
