<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('KİTAPLA — Bildirimler')}"></head>
<body>
<div th:replace="~{fragments :: appnav('')}"></div>

<div class="container" style="padding-top:28px; padding-bottom:48px; max-width:720px">
  <div class="row" style="justify-content:space-between; margin-bottom:20px">
    <h1 style="font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0">Bildirimler</h1>
    <form th:action="@{/bildirimler/hepsi-okundu}" method="post">
      <button class="btn btn-soft btn-sm" type="submit">Tümünü okundu işaretle</button>
    </form>
  </div>

  <div th:if="${basari}" class="alert alert-ok" th:text="${basari}">Tamam</div>

  <div id="liste" th:fragment="liste">
    <div th:if="${#lists.isEmpty(notifications)}" class="card card-pad" style="text-align:center;padding:56px 24px">
      <div style="font-size:19px;font-weight:800;margin-bottom:8px">Henüz bildirimin yok</div>
      <p class="muted" style="font-weight:500;margin:0">Bağış, istek ve takas hareketlerin burada görünecek.</p>
    </div>

    <div class="stack gap-10" th:unless="${#lists.isEmpty(notifications)}">
      <div th:each="n : ${notifications}" class="card card-pad row gap-14"
           th:style="${n.readFlag} ? 'opacity:.7' : ''">
        <div class="badge" style="width:38px;height:38px;border-radius:12px;justify-content:center;padding:0;flex-shrink:0"
             th:classappend="${n.readFlag} ? 'badge-muted' : 'badge-accent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:700;line-height:1.4" th:text="${n.message}">Bildirim</div>
          <div class="muted" style="font-size:12px;font-weight:500;margin-top:3px"
               th:text="${n.createdAtText}">tarih</div>
        </div>
        <button th:unless="${n.readFlag}" class="btn btn-sm btn-soft"
                th:hx-post="@{'/bildirimler/' + ${n.id} + '/okundu'}"
                hx-target="#liste" hx-swap="outerHTML">Okundu</button>
        <span th:if="${n.readFlag}" class="muted" style="font-size:12px;font-weight:600">okundu</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
