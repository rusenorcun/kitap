<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('KİTAPLA — Kitap iste')}"></head>
<body>
<div th:replace="~{fragments :: appnav('istekler')}"></div>

<div class="container" style="padding-top:28px; padding-bottom:56px; max-width:640px">
  <h1 style="font-size:28px;font-weight:800;letter-spacing:-.6px;margin:0 0 4px">Kitap iste</h1>
  <p class="muted" style="font-weight:500;margin:0 0 24px">İhtiyacın olan kitabı listele; bir bağışçı görünce karşılayabilir.</p>

  <div th:if="${hata}" class="alert alert-error" th:text="${hata}" role="alert">Hata</div>

  <form th:action="@{/istek/yeni}" method="post" class="card card-pad">
    <div class="field">
      <label class="label" for="title">Kitap adı</label>
      <input class="input" id="title" name="title" required placeholder="Örn. Simyacı" th:value="${form?.title}"/>
    </div>
    <div class="field">
      <label class="label" for="author">Yazar <span class="muted" style="font-weight:500">(isteğe bağlı)</span></label>
      <input class="input" id="author" name="author" placeholder="Örn. Paulo Coelho" th:value="${form?.author}"/>
    </div>
    <div class="field">
      <label class="label" for="purchaseLink">Alışveriş linki <span class="muted" style="font-weight:500">(isteğe bağlı)</span></label>
      <input class="input" id="purchaseLink" name="purchaseLink" type="url" placeholder="https://..."
             th:value="${form?.purchaseLink}"/>
      <p class="muted" style="font-size:12px;font-weight:500;margin:6px 0 0">
        Link verirsen karşılayan kişi doğru baskıyı kolayca bulur.</p>
    </div>
    <div class="field">
      <label class="label" for="description">Not <span class="muted" style="font-weight:500">(isteğe bağlı)</span></label>
      <textarea class="input" id="description" name="description"
                placeholder="Neden ihtiyacın olduğunu kısaca yazabilirsin…" th:text="${form?.description}"></textarea>
    </div>
    <button class="btn btn-primary btn-block" type="submit">İsteğimi oluştur</button>
    <p class="muted" style="font-size:12px;font-weight:500;text-align:center;margin:12px 0 0">
      Aynı anda en fazla 5 açık isteğin olabilir.</p>
  </form>
</div>
</body>
</html>
