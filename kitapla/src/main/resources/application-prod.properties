# Üretim profili: ters vekil (Caddy) arkasında çalışmak üzere.
# Çalıştırma:  java -jar kitapla.jar --spring.profiles.active=prod

# --- Ters vekil arkasında ---
# Caddy'nin ilettiği X-Forwarded-* başlıkları dikkate alınsın; yoksa giriş
# sonrası yönlendirmeler http:// olarak üretilir ve tarayıcı HTTPS'ten düşer.
server.forward-headers-strategy=framework

# Uygulama varsayılan olarak yalnızca yerel arayüzü dinler; dışarıya sadece
# Caddy açıktır. Docker'da bu 0.0.0.0 olmalıdır (yalıtımı Docker ağı sağlar,
# uygulamanın portu ana makineye hiç yayınlanmaz) — compose bunu ayarlar.
server.address=${KITAPLA_BIND:127.0.0.1}
server.port=${SERVER_PORT:8080}

# Sunucu imzasını ve hata ayrıntılarını dışarı verme
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Oturum çerezi ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# --- Şablon önbelleği açık (dev'de kapalıydı) ---
spring.thymeleaf.cache=true

# --- Veritabanı: PostgreSQL + Flyway ---
spring.datasource.url=jdbc:postgresql://${KITAPLA_DB_HOST:postgres}:${KITAPLA_DB_PORT:5432}/${KITAPLA_DB_NAME:kitapla}
spring.datasource.username=${KITAPLA_DB_USER:kitapla}
spring.datasource.password=${KITAPLA_DB_PASSWORD:kitapla}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Yüklenen dosyalar ---
kitapla.upload-dir=${KITAPLA_UPLOAD_DIR:./uploads}

# --- Loglama ---
logging.level.root=INFO
logging.level.app.kitapla=INFO

# --- Örnek veri (üretimde varsayılan kapalı; .env içinden açılabilir) ---
kitapla.seed.demo=${KITAPLA_SEED_DEMO:false}


