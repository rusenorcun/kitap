# KİTAPLA — yerel çalıştırma
#
#   docker compose up -d --build     başlat (ilk seferde derler)
#   docker compose logs -f           günlükleri izle
#   docker compose down              durdur (veriler kalır)
#
# Uygulama:  http://localhost:8080
#
# Yayına almak için bu dosya yerine docker-compose.prod.yml kullanılır.

services:
  kitapla:
    build: ./kitapla
    container_name: kitapla
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Yerelde HTTPS yok, bu yüzden prod profili kullanılmaz.
      KITAPLA_ADMIN_EMAIL: admin@kitapla.local
      KITAPLA_ADMIN_PASSWORD: admin123
      KITAPLA_CONTACT_EMAIL: destek@kitapla.local
      KITAPLA_BASE_URL: http://localhost:8080
      # Posta kapalı: gönderilecek iletiler günlüğe yazılır.
      # docker compose logs -f kitapla ile şifre sıfırlama bağlantısını görebilirsin.
      KITAPLA_MAIL_ENABLED: "false"

    volumes:
      # Veriler konteynerin DIŞINDA durur; konteyneri silsen de kaybolmaz.
      - kitapla-veri:/uygulama/data
      - kitapla-dosya:/uygulama/uploads

volumes:
  kitapla-veri:
  kitapla-dosya:
